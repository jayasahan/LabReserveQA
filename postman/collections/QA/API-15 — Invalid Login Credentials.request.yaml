$kind: http-request
description: ""
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"admin@labreserve.local\",\r

    \  \"password\": \"DefinitelyWrongPassword123!\"\r

    }"
scripts:
  - type: afterResponse
    code: |
      const response = pm.response.json();

      pm.test("Invalid credentials return 401", function () {
        pm.response.to.have.status(401);
      });

      pm.test("Invalid credentials return a safe error message", function () {
        pm.expect(response.message).to.eql("Invalid email or password");
      });
    language: text/javascript
order: 16000
