$kind: http-request
description: ""
url: "{{baseUrl}}/api/equipment"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |
      const response = pm.response.json();

      pm.test("Admin equipment listing status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Admin equipment listing returns an array", function () {
        pm.expect(response.equipment).to.be.an("array");
      });
    language: text/javascript
order: 3000
